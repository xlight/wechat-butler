server:
  host: "0.0.0.0"
  port: 8837
  log_level: "info"

llm:
  provider: "openai"
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.openai.com/v1"
  default_model: "gpt-4o"
  max_tokens: 4096
  temperature: 0.7
  models:
    - id: "gpt-4o"
      name: "GPT-4o"
    - id: "deepseek-chat"
      name: "DeepSeek Chat"
      provider: "deepseek"
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com/v1"

mcp:
  chatshell_api_url: "http://127.0.0.1:5030/mcp"
  idle_timeout: 300
  connect_timeout: 10

auth:
  api_key: "${BUTLER_API_KEY}"

agent_modes:
  observer:
    enabled: true
    model: null
    max_tokens: null
    system_prompt: null
  mention:
    enabled: true
    model: null
    max_tokens: null
    system_prompt: null
  user_actions:
    enabled: true
    model: null
    max_tokens: null
    system_prompt: null
    analyze:
      model: null
      max_tokens: null
      system_prompt: null
    draft_reply:
      model: null
      max_tokens: null
      system_prompt: null
    free_chat:
      model: null
      max_tokens: null
      system_prompt: null

safety:
  forbidden_send_sessions: []

rate_limiting:
  max_concurrent: 5
  max_requests_per_minute: 10
  queue_timeout_seconds: 30
  per_session_max_per_minute: 5
  mention:
    max_concurrent: 2
  user_actions:
    max_concurrent: 2
  observer:
    max_concurrent: 1
